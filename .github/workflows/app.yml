# Publie l'application app.himmelsweg.fr sur Firebase (gratuit) à chaque modification de app/ sur main.
# Publie aussi les règles de sécurité de la base, après les avoir testées.
# Secret nécessaire (Settings → Secrets and variables → Actions) : FIREBASE_SERVICE_ACCOUNT
# = contenu du fichier JSON « clé privée » du compte de service Firebase.
name: Publier l'app

on:
  push:
    branches: [main]
    paths: ['app/**', 'google/app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'google/app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm run test:regles
      - name: Tests du script Google
        run: node --test ../google/app/script.test.mjs

  publier:
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publier sur Firebase
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT absent : publication impossible."; exit 1; fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/cle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cle.json"
          npx firebase deploy --only hosting,firestore:rules --project himmelsweg-cbd26 --non-interactive
